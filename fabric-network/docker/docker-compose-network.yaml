version: '3.7'

networks:
  rec_network:
    name: rec_network

volumes:
  orderer.rec.com:
  peer0.regulator.rec.com:
  peer0.issuer.rec.com:
  peer0.buyer.rec.com:
  peer0.auditor.rec.com:

services:
  orderer.rec.com:
    image: hyperledger/fabric-orderer:2.5.9
    container_name: orderer.rec.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_FILELEDGER_LOCATION=/var/hyperledger/production/orderer
    working_dir: /root
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/rec.com/orderers/orderer.rec.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/rec.com/orderers/orderer.rec.com/tls:/var/hyperledger/orderer/tls
      - orderer.rec.com:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
      - 7053:7053
    networks:
      - rec_network

  peer0.regulator.rec.com:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.regulator.rec.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=rec_network
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.regulator.rec.com
      - CORE_PEER_ADDRESS=peer0.regulator.rec.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.regulator.rec.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.regulator.rec.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.regulator.rec.com:7051
      - CORE_PEER_LOCALMSPID=RegulatorOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ../organizations/peerOrganizations/regulator.rec.com/peers/peer0.regulator.rec.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/regulator.rec.com/peers/peer0.regulator.rec.com/tls:/etc/hyperledger/fabric/tls
      - peer0.regulator.rec.com:/var/hyperledger/production
    ports:
      - 7051:7051
      - 9443:9443
    networks:
      - rec_network

  peer0.issuer.rec.com:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.issuer.rec.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=rec_network
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.issuer.rec.com
      - CORE_PEER_ADDRESS=peer0.issuer.rec.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.issuer.rec.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.issuer.rec.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.issuer.rec.com:8051
      - CORE_PEER_LOCALMSPID=IssuerOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ../organizations/peerOrganizations/issuer.rec.com/peers/peer0.issuer.rec.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/issuer.rec.com/peers/peer0.issuer.rec.com/tls:/etc/hyperledger/fabric/tls
      - peer0.issuer.rec.com:/var/hyperledger/production
    ports:
      - 8051:8051
      - 9444:9444
    networks:
      - rec_network

  peer0.buyer.rec.com:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.buyer.rec.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=rec_network
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.buyer.rec.com
      - CORE_PEER_ADDRESS=peer0.buyer.rec.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.buyer.rec.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.buyer.rec.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.buyer.rec.com:9051
      - CORE_PEER_LOCALMSPID=BuyerOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ../organizations/peerOrganizations/buyer.rec.com/peers/peer0.buyer.rec.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/buyer.rec.com/peers/peer0.buyer.rec.com/tls:/etc/hyperledger/fabric/tls
      - peer0.buyer.rec.com:/var/hyperledger/production
    ports:
      - 9051:9051
      - 9445:9445
    networks:
      - rec_network

  peer0.auditor.rec.com:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.auditor.rec.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=rec_network
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.auditor.rec.com
      - CORE_PEER_ADDRESS=peer0.auditor.rec.com:10051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer0.auditor.rec.com:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.auditor.rec.com:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.auditor.rec.com:10051
      - CORE_PEER_LOCALMSPID=AuditorOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9446
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ../organizations/peerOrganizations/auditor.rec.com/peers/peer0.auditor.rec.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/auditor.rec.com/peers/peer0.auditor.rec.com/tls:/etc/hyperledger/fabric/tls
      - peer0.auditor.rec.com:/var/hyperledger/production
    ports:
      - 10051:10051
      - 9446:9446
    networks:
      - rec_network

  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5.9
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/:/host/var/run/
      - ../organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ../channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts
      - ../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
    depends_on:
      - orderer.rec.com
      - peer0.regulator.rec.com
      - peer0.issuer.rec.com
      - peer0.buyer.rec.com
      - peer0.auditor.rec.com
    networks:
      - rec_network
